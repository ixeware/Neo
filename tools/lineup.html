<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лайнап моделей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;800;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #d9c9a8; overflow: hidden; font-family: "Golos Text", Arial, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; text-align: center;
    font: 600 11px/1.15 "Golos Text", Arial, sans-serif; color: #1b1a17; background: rgba(255, 250, 238, 0.86);
    padding: 2px 5px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.12); }
  .lbl small { display: block; font-weight: 500; color: #6a6355; font-size: 10px; }
  .lbl.s0 { border-bottom: 3px solid #2a52d1; } .lbl.s1 { border-bottom: 3px solid #d8361f; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  #bar a { color: #1b1a17; background: rgba(255, 250, 238, 0.9); padding: 3px 8px; border-radius: 3px; text-decoration: none; border: 1px solid rgba(0,0,0,.15); }
  #bar a.on { background: #1b1a17; color: #fff8ea; }
  #grid { position: fixed; inset: 40px 8px 8px; display: none; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow: auto; }
  #grid figure { margin: 0; background: #f4ecd9; border-radius: 6px; padding: 4px; text-align: center; font-size: 11px; }
  #grid img { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="grid"></div>
<nav id="bar"></nav>
<script type="module" src="./lineup.ts"></script>
</body>
</html>
